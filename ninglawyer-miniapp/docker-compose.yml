version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:14-alpine
    container_name: ninglawyer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ninglawyer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ninglawyer_password}
      POSTGRES_DB: ${POSTGRES_DB:-ninglawyer_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ninglawyer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ninglawyer-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninglawyer-app
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://${POSTGRES_USER:-ninglawyer}:${POSTGRES_PASSWORD:-ninglawyer_password}@postgres:5432/${POSTGRES_DB:-ninglawyer_db}
      
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # Celery 配置
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      
      # API 配置
      API_HOST: 0.0.0.0
      API_PORT: 5000
      DEBUG: ${DEBUG:-False}
      
      # 安全配置
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      
      # 微信小程序配置
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      
      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninglawyer-celery-worker
    command: celery -A src.tasks.async_tasks worker --loglevel=info
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://${POSTGRES_USER:-ninglawyer}:${POSTGRES_PASSWORD:-ninglawyer_password}@postgres:5432/${POSTGRES_DB:-ninglawyer_db}
      
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # Celery 配置
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      
      # 安全配置
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # Celery Beat（定时任务调度）
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninglawyer-celery-beat
    command: celery -A src.tasks.async_tasks beat --loglevel=info
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://${POSTGRES_USER:-ninglawyer}:${POSTGRES_PASSWORD:-ninglawyer_password}@postgres:5432/${POSTGRES_DB:-ninglawyer_db}
      
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # Celery 配置
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      
      # 安全配置
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # Nginx（可选，用于反向代理）
  nginx:
    image: nginx:alpine
    container_name: ninglawyer-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - ninglawyer-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  ninglawyer-network:
    driver: bridge
