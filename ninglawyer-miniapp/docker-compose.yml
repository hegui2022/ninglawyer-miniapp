# 宁律师法律咨询小程序矩阵 - Docker Compose
version: '3.8'

services:
  # 主应用服务
  app:
    build: .
    container_name: ninglawyer-app
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ninglawyer
      - DB_USER=postgres
      - DB_PASSWORD=ninglawyer123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ninglawyer123
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - DEBUG=False
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./logs:/app/work/logs/bypass
    depends_on:
      - postgres
      - redis
      - milvus
      - neo4j
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: ninglawyer-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ninglawyer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ninglawyer123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ninglawyer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # Milvus 向量数据库
  milvus:
    image: milvusdb/milvus:latest
    container_name: ninglawyer-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # Milvus 依赖 - etcd
  etcd:
    image: quay.io/coreos/etcd:latest
    container_name: ninglawyer-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # Milvus 依赖 - MinIO
  minio:
    image: minio/minio:latest
    container_name: ninglawyer-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ACCESS_KEY=minglawyer_access
      - MINIO_SECRET_KEY=minglawyer_secret
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - ninglawyer-network
    restart: unless-stopped

  # Neo4j 图数据库
  neo4j:
    image: neo4j:5-community
    container_name: ninglawyer-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/ninglawyer123
    volumes:
      - neo4j-data:/data
    networks:
      - ninglawyer-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  milvus-data:
  etcd-data:
  minio-data:
  neo4j-data:

networks:
  ninglawyer-network:
    driver: bridge
